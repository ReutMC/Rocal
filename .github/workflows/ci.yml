name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rocal.slnx

      - name: Build (Release)
        run: dotnet build Rocal.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Rocal.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish win-x64
        run: dotnet publish src/Rocal.App/Rocal.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Rocal-win-x64
          path: artifacts/publish
