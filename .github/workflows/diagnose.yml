name: Diagnose

# Temporary Phase 0 workflow: runs the same steps as CI, captures each step's log
# and posts the error lines and log tails as a pull request comment.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test with captured logs
        id: run
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $results = New-Object System.Collections.Generic.List[string]
          $body = New-Object System.Collections.Generic.List[string]
          $anyFailed = $false

          dotnet --info *> diag-info.txt
          $body.Add("### dotnet --info (first lines)")
          $body.Add('```')
          (Get-Content diag-info.txt -TotalCount 12) | ForEach-Object { $body.Add($_) }
          $body.Add('```')

          function Run-Step([string]$name, [string[]]$cmdArgs) {
            & dotnet @cmdArgs *> "diag-$name.txt"
            $code = $LASTEXITCODE
            $results.Add("- **$name**: exit code $code")
            if ($code -ne 0) { $script:anyFailed = $true }
            $body.Add("### $name (exit $code)")
            $errs = Select-String -Path "diag-$name.txt" -Pattern 'error |NU[0-9]{4}|MSB[0-9]{4}|Failed |Assert\.' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30
            if ($errs) {
              $body.Add("Error lines:")
              $body.Add('```')
              $errs | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) } else { $_ } } | ForEach-Object { $body.Add($_) }
              $body.Add('```')
            }
            $body.Add("Log tail:")
            $body.Add('```')
            (Get-Content "diag-$name.txt" -Tail 15) | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) } else { $_ } } | ForEach-Object { $body.Add($_) }
            $body.Add('```')
          }

          Run-Step 'restore' @('restore', 'Rocal.slnx')
          Run-Step 'build' @('build', 'Rocal.slnx', '-c', 'Release', '--no-restore')
          Run-Step 'test' @('test', 'Rocal.slnx', '-c', 'Release', '--no-build')
          Run-Step 'publish' @('publish', 'src/Rocal.App/Rocal.App.csproj', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', '-o', 'artifacts/publish')

          $header = @('## CI diagnosis', '') + $results + @('')
          ($header + $body) -join "`n" | Set-Content -Encoding utf8 diag-body.md
          if ($anyFailed) { exit 1 }

      - name: Post diagnosis as PR comment
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file diag-body.md

      - name: Fail if the build failed
        if: steps.run.outcome == 'failure'
        run: exit 1
